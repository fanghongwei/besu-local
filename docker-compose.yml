# Run ./start.sh to generate the private network configuration first.
services:
  node1:
    image: hyperledger/besu:26.10.0
    command:
      - "--genesis-file=/config/genesis.json"
      - "--data-path=/opt/besu/data"
      - "--node-private-key-file=/config/key"
      - "--static-nodes-file=/config/static-nodes.json"
      - "--discovery-enabled=false"
      - "--bootnodes="
      - "--nat-method=NONE"
      - "--sync-mode=FULL"
      - "--sync-min-peers=1"
      - "--rpc-http-enabled"
      - "--rpc-http-host=0.0.0.0"
      - "--rpc-http-api=ETH,NET,WEB3,ADMIN,QBFT"
      - "--host-allowlist=localhost,127.0.0.1"
      - "--min-gas-price=1000000000"
      - "--p2p-host=172.28.0.11"
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - qbft_node1_data:/opt/besu/data
      - type: bind
        source: ./network/genesis.json
        target: /config/genesis.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./network/node1/key
        target: /config/key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./network/node1/static-nodes.json
        target: /config/static-nodes.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      besu_net:
        ipv4_address: 172.28.0.11

